<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060e19"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>JARVIS PC CONTROL</title></head><body><main class="shell"><header><div><div class="eyebrow">REMOTE MANAGEMENT / 04</div><h1>J.A.R.V.I.S. <span>PC CONTROL</span></h1></div><button id="logout" class="outline" hidden>Выйти</button></header><section id="loginPanel" class="panel" hidden><h2>Вход администратора</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Войти</button></form><p id="loginError" role="alert"></p></section><section id="dashboard" hidden><div class="hero"><div class="radar"><svg viewBox="0 0 180 180" aria-hidden="true"><circle class="outer" cx="90" cy="90" r="83"/><g class="spin"><circle cx="90" cy="90" r="72" stroke-dasharray="90 25 30 307"/><circle cx="90" cy="90" r="64" stroke-dasharray="3 6"/></g><g class="reverse"><circle cx="90" cy="90" r="53" stroke-dasharray="55 28"/></g></svg><div class="radartext"><strong id="onlineCount">0/3</strong><small>В СЕТИ</small></div></div><div class="telemetry"><span class="eyebrow">SYSTEM STATUS</span><strong id="connection">Подключение…</strong><div id="nodes" class="nodes"></div><small id="account"></small></div></div><div id="cards" class="cards"></div><button id="allOff" class="danger wide" disabled><svg viewBox="0 0 24 24"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></svg>Выключить все ПК</button><p id="message" role="status"></p></section><footer>JARVIS / CONTROL SYSTEM <span>V4.0</span></footer></main><dialog id="confirmDialog"><form method="dialog"><div class="eyebrow">COMMAND AUTHORIZATION</div><h2>Подтвердить выключение</h2><p id="confirmNames"></p><p class="muted">Несохранённые данные могут быть потеряны.</p><div class="actions"><button value="cancel" autofocus>Отмена</button><button class="danger" value="ok">Выключить</button></div></form></dialog><script type="module" src="app.js?v=4"></script></body></html>
